# =============================================================
# configs/train_local_smoke.yaml
# AAA Engine – B1 Fine-Tune – LOCAL CPU SMOKE TEST CONFIG
# =============================================================
# Purpose: fast end-to-end sanity check on a laptop/workstation
#          with no GPU and a tiny synthetic dataset.
#
# Run:
#   cd d:\AAA_Layer1
#   python -m aaa_engine.training.train_b1 --config configs/train_local_smoke.yaml
#
# All paths are relative to the working directory (project root)
# unless they begin with ~/ or an absolute prefix.
# =============================================================

# ── Data ──────────────────────────────────────────────────────

# Root folder from which relative wav_path entries in manifests are resolved.
data_folder: aaa_engine/sample_dataset

# Explicit paths to train/val CSV manifests.
# If omitted, train_b1.py defaults to {data_folder}/train.csv and val.csv.
train_manifest: aaa_engine/training/manifests/train.csv
val_manifest: aaa_engine/training/manifests/dev.csv

# ── Pretrained model ──────────────────────────────────────────

# [BASELINE] HuggingFace Hub model ID or local directory.
# The SpeechBrain inference API will download weights on first run.
pretrained_path: speechbrain/spkrec-ecapa-voxceleb

# [BASELINE] Local cache directory for downloaded pretrained weights.
# Uses the standard HuggingFace snapshot layout.
pretrained_savedir: ~/.cache/huggingface/hub/models--speechbrain--spkrec-ecapa-voxceleb/snapshots/0f99f2d0ebe89ac095bcc5903c4dd8f72b367286

# [BASELINE] Direct path to the embedding_model.ckpt for Windows-safe loading.
# Skips SpeechBrain's from_hparams() which requires symlink privilege on Windows.
# Leave null on Linux/HPC to use the from_hparams() path.
pretrained_ckpt_direct: ~/.cache/huggingface/hub/models--speechbrain--spkrec-ecapa-voxceleb/snapshots/0f99f2d0ebe89ac095bcc5903c4dd8f72b367286/embedding_model.ckpt

# ── Augmentation ──────────────────────────────────────────────

# MUSAN noise corpus root.  Set to null to disable noise injection.
musan_dir: null

# RIRS_NOISES reverb corpus root.  Set to null to disable reverb.
rirs_dir: null

# ── Model head ────────────────────────────────────────────────

# Number of speaker classes.
# Must match the number of unique speakers in the training manifest.
# 20 matches the synthetic dataset generated by generate_sample_dataset.py
out_n_neurons: 20

# ── Training schedule ─────────────────────────────────────────

# Micro-batch size (per gradient-accumulation step).
# Effective batch = batch_size * grad_accum_steps = 4 * 8 = 32
batch_size: 4

# Gradient accumulation steps.  Accumulate this many micro-batches
# before each optimiser update.  Effective batch = 4 * 8 = 32.
grad_accum_steps: 8

# Total number of training epochs.
number_of_epochs: 2

# Random crop lengths (seconds) to pick from uniformly each batch.
# Short values speed up smoke testing.
crop_lengths: [1, 2]

# ── Optimiser ─────────────────────────────────────────────────

# [FINE-TUNED] AdamW learning rate for the frozen/unfrozen backbone.
backbone_lr: 0.0001

# [CUSTOM] AdamW learning rate for the AAM-Softmax head.
head_lr: 0.001

# ── Scheduler ─────────────────────────────────────────────────

# Number of linear-warmup steps before cosine decay begins.
# Keep small for smoke runs.
warmup_steps: 50

# ── AAM-Softmax loss ──────────────────────────────────────────

# Angular margin m (radians).  Ramped from 0 to this value over
# the first 20% of training steps.
aam_margin: 0.2

# Feature scale s.
aam_scale: 30

# ── Gradient clipping ─────────────────────────────────────────

# Max L2 norm of gradients before clipping.
grad_clip: 5.0

# ── Early stopping ────────────────────────────────────────────

# Stop training if val EER does not improve for this many epochs.
patience: 3

# ── Logging ───────────────────────────────────────────────────

# Append a metrics.jsonl row every N global steps.
log_every_n_steps: 10

# ── DataLoader ────────────────────────────────────────────────

# Number of DataLoader worker processes.
# 0 = main process only (required on Windows in many setups).
num_workers: 0

# ── Reproducibility ───────────────────────────────────────────

# Master random seed for torch, numpy, python random, and augmenter.
seed: 1986

# ── Sanity / debug ────────────────────────────────────────────

# [EXPERIMENT] If true, speaker labels are randomly shuffled.
# The model must fail to learn.  Use only for sanity testing.
debug_shuffle_labels: false

# ── Output ────────────────────────────────────────────────────

# Directory under which per-run sub-directories are created.
# Each run creates: runs/<run_id>/checkpoint_last.pt, metrics.jsonl, etc.
runs_dir: runs
